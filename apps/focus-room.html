<!doctype html>
<script src="../player-compat.js" data-turbogames-compat></script>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Room</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 20%,#214b4c,#111419 70%);color:#eef4ef;font:15px system-ui,sans-serif}.room{text-align:center;width:min(92vw,480px)}.eyebrow{font:11px monospace;letter-spacing:2px;color:#9daead}h1{font-size:30px;color:#d7ff66}.clock{font:clamp(72px,17vw,120px)/1.1 ui-monospace,monospace;letter-spacing:-8px;margin:26px 0;color:#f2f4dd}.controls{display:flex;justify-content:center;gap:10px}.controls button{padding:11px 17px;border:1px solid #ffffff32;border-radius:8px;background:#ffffff0b;color:#fff;cursor:pointer}.controls button.primary{background:#d7ff66;color:#151a0e;border-color:#d7ff66;font-weight:700}p{color:#a9b6b0}label{font-size:13px;color:#acb8b3}input{width:55px;margin:0 5px;padding:6px;border:1px solid #ffffff38;border-radius:5px;background:#111;color:white;text-align:center}</style><main class="room"><p class="eyebrow">A QUIET LITTLE CORNER</p><h1>Focus Room</h1><p>Set a timer. Put the noise away.</p><div class="clock" id="clock">25:00</div><div class="controls"><button class="primary" id="toggle">Start focus</button><button id="reset">Reset</button></div><p><label>Focus minutes <input id="minutes" type="number" min="1" max="120" value="25"></label></p><p id="status" aria-live="polite">Ready when you are.</p></main><script>let left=1500,timer=null;const clock=document.querySelector('#clock'),status=document.querySelector('#status'),toggle=document.querySelector('#toggle');function show(){clock.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`}document.querySelector('#minutes').onchange=e=>{if(timer)return;left=Math.max(60,Math.min(7200,(Number(e.target.value)||25)*60));show()};toggle.onclick=()=>{if(timer){clearInterval(timer);timer=null;toggle.textContent='Resume focus';status.textContent='Paused. Take a breath.';return}toggle.textContent='Pause';status.textContent='You’ve got this.';timer=setInterval(()=>{left--;show();if(left<=0){clearInterval(timer);timer=null;toggle.textContent='Start again';status.textContent='Focus session complete. Nice work! ✨'}},1000)};document.querySelector('#reset').onclick=()=>{clearInterval(timer);timer=null;left=(Number(document.querySelector('#minutes').value)||25)*60;toggle.textContent='Start focus';status.textContent='Ready when you are.';show()};show();</script></html>
