<!doctype html>
<script src="../player-compat.js" data-turbogames-compat></script>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Match</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#2c2457,#11111a 68%);color:#f5f3ff;font:15px system-ui,sans-serif}main{width:min(92vw,540px);text-align:center}h1{margin:8px 0;color:#d7ff66;font-size:clamp(25px,5vw,39px)}p{color:#b8b5d1}.meta{display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{aspect-ratio:1;border:1px solid #ffffff24;border-radius:12px;background:linear-gradient(145deg,#57449b,#312c63);font-size:clamp(25px,7vw,43px);cursor:pointer;transition:transform .18s,background .2s}.card:hover{transform:translateY(-3px)}.card.open,.card.matched{background:linear-gradient(145deg,#d7ff66,#81d6bc);color:#17211b}.card.matched{opacity:.64}.reset{margin-top:17px;padding:10px 17px;border:0;border-radius:8px;background:#d7ff66;color:#16190f;font-weight:700;cursor:pointer}</style><main><h1>Little Match</h1><p>Find all eight pairs. Take your time.</p><div class="meta"><p>Moves: <b id="moves">0</b></p><p id="message" aria-live="polite">0 / 8 pairs</p></div><div class="grid" id="grid"></div><button class="reset" id="reset">Shuffle cards</button></main><script>const symbols=['✦','◈','☼','♢','✿','☾','✧','⬡'];let first=null,lock=false,moves=0,matched=0;function start(){const deck=[...symbols,...symbols].sort(()=>Math.random()-.5);first=null;lock=false;moves=0;matched=0;document.querySelector('#moves').textContent='0';document.querySelector('#message').textContent='0 / 8 pairs';const grid=document.querySelector('#grid');grid.replaceChildren();deck.forEach((symbol,i)=>{const b=document.createElement('button');b.className='card';b.type='button';b.setAttribute('aria-label',`Card ${i+1}, hidden`);b.textContent='?';b.onclick=()=>{if(lock||b.classList.contains('open')||b.classList.contains('matched'))return;b.classList.add('open');b.textContent=symbol;b.setAttribute('aria-label',symbol);if(!first){first=b;return}moves++;document.querySelector('#moves').textContent=moves;if(first.textContent===b.textContent){first.classList.add('matched');b.classList.add('matched');first=null;matched++;document.querySelector('#message').textContent=matched===8?'All pairs found! ✨':`${matched} / 8 pairs`}else{lock=true;const prev=first;first=null;setTimeout(()=>{for(const card of [prev,b]){card.classList.remove('open');card.textContent='?';card.setAttribute('aria-label','Hidden card')}lock=false},750)}};grid.append(b)})}document.querySelector('#reset').onclick=start;start();</script></html>
