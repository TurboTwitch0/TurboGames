<!doctype html>
<script src="../player-compat.js" data-turbogames-compat></script>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Breaker</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#202849,#101117 68%);color:#eff2ff;font:15px system-ui,sans-serif}main{width:min(92vw,560px);text-align:center}h1{font-size:clamp(24px,5vw,38px);margin:8px 0;color:#d7ff66}p{color:#abb4cf}canvas{display:block;width:100%;aspect-ratio:1.5;border:1px solid #ffffff2a;border-radius:14px;background:#0c1020;touch-action:none}button{border:0;border-radius:8px;background:#d7ff66;color:#15180c;padding:11px 18px;font-weight:700;cursor:pointer}#score{color:#ff7ab6;font-weight:700}</style><main><h1>Orbit Breaker</h1><p>Move your mouse or finger to steer. Break the orbiting stars!</p><p>Score: <span id="score">0</span></p><canvas id="board" width="720" height="480" aria-label="Orbit Breaker game"></canvas><p><button id="start">Start game</button></p></main><script>const c=document.querySelector('#board'),x=c.getContext('2d'),scoreEl=document.querySelector('#score');let paddle=360,balls=[],stars=[],score=0,running=false;function reset(){score=0;scoreEl.textContent=score;paddle=360;balls=[{x:360,y:410,vx:3,vy:-4,r:8}];stars=Array.from({length:28},(_,i)=>({x:42+(i%7)*106,y:52+Math.floor(i/7)*35,on:true}));running=true;frame()}function frame(){x.clearRect(0,0,720,480);x.fillStyle='#0c1020';x.fillRect(0,0,720,480);x.strokeStyle='#ffffff14';for(let i=0;i<8;i++){x.beginPath();x.arc(360,230,45+i*35,0,7);x.stroke()}stars.forEach(s=>{if(!s.on)return;x.fillStyle=['#d7ff66','#ff7ab6','#8298ff'][Math.floor(s.x+s.y)%3];x.beginPath();x.arc(s.x,s.y,8,0,7);x.fill()});x.fillStyle='#d7ff66';x.fillRect(paddle-50,445,100,10);balls.forEach(b=>{x.fillStyle='#fff';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();b.x+=b.vx;b.y+=b.vy;if(b.x<8||b.x>712)b.vx*=-1;if(b.y<8)b.vy*=-1;if(b.y>434&&b.x>paddle-56&&b.x<paddle+56)b.vy=-Math.abs(b.vy);stars.forEach(s=>{if(s.on&&Math.hypot(b.x-s.x,b.y-s.y)<17){s.on=false;b.vy*=-1;score++;scoreEl.textContent=score}})});if(balls.some(b=>b.y>490)){running=false;x.fillStyle='#ff7ab6';x.font='bold 28px system-ui';x.textAlign='center';x.fillText('Nice run! Press Start to play again.',360,260);return}if(running)requestAnimationFrame(frame)}function steer(e){const r=c.getBoundingClientRect();paddle=Math.max(52,Math.min(668,(e.clientX-r.left)*720/r.width))}c.addEventListener('pointermove',steer);c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);steer(e)});document.querySelector('#start').onclick=reset;</script></html>
