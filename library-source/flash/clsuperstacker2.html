<!doctype html>
<!-- Ultimate Game Stash source: https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Stacker 2</title>
<style>html,body{width:100%;height:100%;margin:0;background:#080a10;color:#fff;font:16px system-ui;overflow:hidden}#game{width:100%;height:100%}ruffle-player{display:block;width:100%;height:100%}#status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:2rem;pointer-events:none}</style></head>
<body><div id="game"></div><div id="status" role="status">Loading Super Stacker 2…</div>
<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.js"></script>
<script>
(async () => {
 const status=document.getElementById('status');
 try {
  if (!window.RufflePlayer) throw new Error('The Flash player could not be downloaded. Check your internet connection.');
  const player=window.RufflePlayer.newest().createPlayer();
  document.getElementById('game').appendChild(player);
  await player.load({url:"https://cdn.jsdelivr.net/gh/coollittledude21/Super-Stacker-2@053f3c7362d787487583f25c02a288ca25a741d2/481558_superstacker2.swf",autoplay:'on',allowScriptAccess:false,backgroundColor:'#080a10'});
  status.remove();
 } catch (error) { status.textContent='Unable to load Super Stacker 2. '+error.message; }
})();
</script></body></html>
