<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BREADSKATE Forever</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #141414; color: #ddd; }
    body { display: flex; flex-direction: column; font: 12px/1.4 system-ui, sans-serif; }
    #game-viewport { flex: 1; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    iframe { flex: none; width: 960px; height: 640px; border: 0; background: #141414; transform: scale(var(--game-scale, 1)); }
    p { flex: none; margin: 0; padding: 6px 10px; text-align: center; }
    a { color: #ddd; }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <!-- Creator-hosted build linked by https://sirmilkman.itch.io/breadskate-forever.
       It retains the original Topskate.js build (cachebust=336418708), replacing
       the removed gamedump copy without copying third-party game assets. -->
  <div id="game-viewport">
    <iframe title="BREADSKATE Forever" src="https://html-classic.itch.zone/html/13327050/index.html?v=1782560171" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
  </div>
  <p><a href="https://sirmilkman.itch.io/breadskate-forever" target="_blank" rel="noopener noreferrer">BREADSKATE Forever · sirmilkman &amp; Oroshibu · Creator page</a></p>
  <script>
    // The original game uses a fixed 960×640 canvas. Keep its viewport intact
    // and scale the frame, so narrow and short players do not crop its controls.
    const viewport = document.querySelector('#game-viewport');
    const fitGame = () => viewport.style.setProperty('--game-scale', Math.min(viewport.clientWidth / 960, viewport.clientHeight / 640));
    new ResizeObserver(fitGame).observe(viewport);
    fitGame();
  </script>
</body>
</html>
