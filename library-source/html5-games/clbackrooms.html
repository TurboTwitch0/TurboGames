<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Backrooms Multiplayer</title>
<style>
:root{color-scheme:dark;--yellow:#d2bd68;--panel:rgba(18,17,12,.93);--line:rgba(255,241,172,.22)}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#080907;color:#fff;font:600 14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}canvas{display:block;width:100%;height:100%;background:#17170f}.menu{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 30%,rgba(219,197,106,.16),transparent 45%),#0a0b08;z-index:4}.panel{width:min(470px,100%);padding:26px;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 24px 80px #000}h1{margin:0 0 5px;color:#ead982;font-size:clamp(26px,6vw,42px);letter-spacing:.06em;text-transform:uppercase}.sub{margin:0 0 20px;color:#b8b49a;font-weight:500}label{display:block;margin:12px 0 6px;color:#d9d4b6;font-size:12px;text-transform:uppercase;letter-spacing:.12em}input{width:100%;padding:12px 14px;border:1px solid #5b5538;border-radius:10px;background:#11120d;color:#fff;outline:none}input:focus{border-color:#d6c269;box-shadow:0 0 0 3px rgba(214,194,105,.14)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}button{border:0;border-radius:10px;padding:12px 14px;background:#d2bd68;color:#1b190f;cursor:pointer;font-weight:800}button:hover{filter:brightness(1.12)}button.alt{background:#303126;color:#eee}button:disabled{opacity:.55;cursor:wait}#status{min-height:21px;margin:12px 0 0;color:#c9c5ad;font-weight:500}.hint{margin:16px 0 0;color:#8f8c79;font-size:12px;font-weight:500}#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:2}.chip{position:absolute;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:rgba(10,11,8,.78);backdrop-filter:blur(5px)}#room-chip{top:12px;left:12px}#goal-chip{top:12px;right:12px;color:#e9da8c}#help-chip{left:12px;bottom:12px;color:#c4c1ae;font-size:12px;font-weight:500}#chat{position:absolute;right:12px;bottom:12px;width:min(330px,calc(100% - 24px));pointer-events:auto}#messages{max-height:150px;overflow:hidden;display:flex;flex-direction:column;justify-content:end;gap:4px;margin-bottom:6px;text-shadow:0 2px 3px #000}.msg{padding:4px 8px;border-radius:7px;background:rgba(0,0,0,.52);font-weight:500}#chat-input{display:none;padding:9px 10px;background:rgba(10,11,8,.94)}#toast{position:fixed;left:50%;top:18%;translate:-50% -50%;padding:12px 18px;border:1px solid var(--line);border-radius:10px;background:rgba(10,11,8,.9);opacity:0;transition:.2s;z-index:3;pointer-events:none;text-align:center}#toast.show{opacity:1}@media(max-width:600px){.actions{grid-template-columns:1fr}.panel{padding:20px}#help-chip{display:none}}
</style></head><body>
<canvas id="game" aria-label="Backrooms multiplayer game"></canvas>
<section id="menu" class="menu"><div class="panel"><h1>Backrooms</h1><p class="sub">Multiplayer maze escape</p><label for="name">Player name</label><input id="name" maxlength="16" value="Wanderer" autocomplete="nickname"><label for="room">Room code</label><input id="room" maxlength="6" placeholder="Enter 6 characters" autocomplete="off"><div class="actions"><button id="host">Create room</button><button id="join">Join room</button><button id="solo" class="alt">Solo practice</button><button id="copy" class="alt" hidden>Copy room code</button></div><p id="status">Create a room and send the code to a friend.</p><p class="hint">Move with WASD or arrow keys. Press Enter to chat. Find the green exit together. Online rooms use a direct browser connection.</p></div></section>
<div id="hud"><div class="chip" id="room-chip"></div><div class="chip" id="goal-chip">Find the green exit</div><div class="chip" id="help-chip">WASD / arrows · Enter chat · F fullscreen · Esc menu</div><div id="chat"><div id="messages"></div><input id="chat-input" maxlength="100" placeholder="Message the room…"></div></div><div id="toast"></div>
<script src="../../../vendor/peerjs/peerjs.min.js"></script><script>
(()=>{'use strict';
const q=s=>document.querySelector(s),canvas=q('#game'),ctx=canvas.getContext('2d'),menu=q('#menu'),hud=q('#hud'),status=q('#status'),roomInput=q('#room'),nameInput=q('#name'),chatInput=q('#chat-input'),messages=q('#messages'),toast=q('#toast');
const CELL=72,COLS=31,ROWS=23,PREFIX='tg-backrooms-',palette=['#64d9ff','#ff7a8a','#8bff7a','#d990ff','#ffb86a','#7a91ff'];
let maze=[],seed=1,exit={x:COLS-2,y:ROWS-2},peer,connections=[],hostConnection,isHost=false,online=false,running=false,last=0,lastSend=0,joinTimer,entity={x:0,y:0};
let me={id:'solo',name:'Wanderer',x:CELL*1.5,y:CELL*1.5,color:palette[0],won:false},players=new Map(),keys=new Set();
const PEER_OPTIONS={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}};
const clean=s=>String(s||'').replace(/[^a-zA-Z0-9 _-]/g,'').trim().slice(0,16)||'Wanderer',makeCode=()=>Math.random().toString(36).slice(2,8).toUpperCase();
function randomFrom(value){return()=>{value|=0;value=value+0x6D2B79F5|0;let t=Math.imul(value^value>>>15,1|value);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildMaze(value){seed=value>>>0;const rnd=randomFrom(seed);maze=Array.from({length:ROWS},()=>Array(COLS).fill(1));const stack=[[1,1]];maze[1][1]=0;while(stack.length){const [x,y]=stack.at(-1),dirs=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>rnd()-.5);let moved=false;for(const [dx,dy] of dirs){const nx=x+dx,ny=y+dy;if(nx>0&&ny>0&&nx<COLS-1&&ny<ROWS-1&&maze[ny][nx]){maze[y+dy/2][x+dx/2]=0;maze[ny][nx]=0;stack.push([nx,ny]);moved=true;break}}if(!moved)stack.pop()}exit={x:COLS-2,y:ROWS-2};maze[exit.y][exit.x]=maze[exit.y][exit.x-1]=0;for(let i=0;i<45;i++){const x=1+Math.floor(rnd()*(COLS-2)),y=1+Math.floor(rnd()*(ROWS-2));if((x+y)%2)maze[y][x]=0}entity={x:CELL*(COLS/2|0)+CELL/2,y:CELL*(ROWS/2|0)+CELL/2}}
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function blocked(x,y,r=15){return[[x-r,y-r],[x+r,y-r],[x-r,y+r],[x+r,y+r]].some(([px,py])=>{const cx=Math.floor(px/CELL),cy=Math.floor(py/CELL);return cy<0||cx<0||cy>=ROWS||cx>=COLS||maze[cy][cx]})}
function move(dt){let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);if(dx&&dy){dx*=.707;dy*=.707}const nx=me.x+dx*205*dt,ny=me.y+dy*205*dt;if(!blocked(nx,me.y))me.x=nx;if(!blocked(me.x,ny))me.y=ny;const ex=(exit.x+.5)*CELL,ey=(exit.y+.5)*CELL;if(!me.won&&Math.hypot(me.x-ex,me.y-ey)<32){me.won=true;notify('You found the exit!');send({type:'win',id:me.id,name:me.name})}}
function moveEntity(dt){if(online&&!isHost)return;const all=[me,...players.values()].filter(p=>!p.won);if(!all.length)return;const target=all.reduce((a,b)=>Math.hypot(b.x-entity.x,b.y-entity.y)<Math.hypot(a.x-entity.x,a.y-entity.y)?b:a,all[0]),dx=target.x-entity.x,dy=target.y-entity.y,d=Math.hypot(dx,dy)||1,nx=entity.x+dx/d*58*dt,ny=entity.y+dy/d*58*dt;if(!blocked(nx,entity.y,18))entity.x=nx;else entity.y+=Math.sign(dy)*58*dt;if(!blocked(entity.x,ny,18))entity.y=ny;else entity.x+=Math.sign(dx)*58*dt;if(Math.hypot(target.x-entity.x,target.y-entity.y)<30){if(target.id===me.id){me.x=CELL*1.5;me.y=CELL*1.5;notify('A smiler found you. Back to the start.')}else send({type:'caught',id:target.id})}}
function person(x,y,color,name,monster=false){ctx.save();ctx.translate(x,y);ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=monster?22:12;ctx.beginPath();ctx.arc(0,0,monster?17:14,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(monster){ctx.fillStyle='#fff';ctx.fillRect(-9,-5,5,3);ctx.fillRect(4,-5,5,3);ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(0,2,9,.1,Math.PI-.1);ctx.stroke()}ctx.fillStyle='#fff';ctx.font='700 11px system-ui';ctx.textAlign='center';ctx.fillText(name,0,-23);ctx.restore()}
function draw(){const w=innerWidth,h=innerHeight,camX=me.x-w/2,camY=me.y-h/2;ctx.fillStyle='#11120d';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(-camX,-camY);const sx=Math.max(0,Math.floor(camX/CELL)-1),sy=Math.max(0,Math.floor(camY/CELL)-1),ex=Math.min(COLS,Math.ceil((camX+w)/CELL)+1),ey=Math.min(ROWS,Math.ceil((camY+h)/CELL)+1);for(let y=sy;y<ey;y++)for(let x=sx;x<ex;x++){const px=x*CELL,py=y*CELL;if(maze[y][x]){ctx.fillStyle=(x+y)%2?'#b8a551':'#c5b260';ctx.fillRect(px,py,CELL+1,CELL+1);ctx.strokeStyle='rgba(75,66,29,.23)';for(let n=8;n<CELL;n+=14){ctx.beginPath();ctx.moveTo(px,py+n);ctx.lineTo(px+CELL,py+n+3);ctx.stroke()}}else{ctx.fillStyle=(x+y)%2?'#56513b':'#615b42';ctx.fillRect(px,py,CELL+1,CELL+1);ctx.fillStyle='rgba(255,255,210,.025)';ctx.fillRect(px+6,py+6,CELL-12,CELL-12)}}const gx=(exit.x+.5)*CELL,gy=(exit.y+.5)*CELL;ctx.fillStyle='#51ff87';ctx.shadowColor='#51ff87';ctx.shadowBlur=24;ctx.fillRect(gx-22,gy-30,44,60);ctx.shadowBlur=0;ctx.fillStyle='#07130b';ctx.font='800 12px system-ui';ctx.textAlign='center';ctx.fillText('EXIT',gx,gy+4);person(entity.x,entity.y,'#050505','SMILER',true);for(const p of players.values())person(p.x,p.y,p.color,p.name);person(me.x,me.y,me.color,me.name);ctx.restore();const light=ctx.createRadialGradient(w/2,h/2,70,w/2,h/2,Math.max(w,h)*.62);light.addColorStop(0,'rgba(0,0,0,0)');light.addColorStop(.5,'rgba(0,0,0,.1)');light.addColorStop(1,'rgba(0,0,0,.91)');ctx.fillStyle=light;ctx.fillRect(0,0,w,h)}
function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.035)||0;last=now;move(dt);moveEntity(dt);if(now-lastSend>70){lastSend=now;send({type:'state',player:me,entity:isHost||!online?entity:undefined})}draw();requestAnimationFrame(loop)}
function start(value,label){buildMaze(value);me={id:peer?.id||'solo',name:clean(nameInput.value),x:CELL*1.5,y:CELL*1.5,color:palette[Math.floor(Math.random()*palette.length)],won:false};players.clear();menu.style.display='none';hud.style.display='block';q('#room-chip').textContent=label;running=true;last=performance.now();requestAnimationFrame(loop);canvas.focus()}
function broadcast(data,except){for(const c of connections)if(c.open&&c!==except)c.send(data)}function send(data){if(!online)return;if(isHost)broadcast(data);else if(hostConnection?.open)hostConnection.send(data)}
function accept(conn){connections.push(conn);conn.on('open',()=>{conn.send({type:'session',seed,players:[me,...players.values()],entity});addMessage('System',`${conn.metadata?.name||'A wanderer'} joined`)});conn.on('data',d=>handle(d,conn));conn.on('close',()=>{connections=connections.filter(c=>c!==conn);players.delete(conn.peer);broadcast({type:'leave',id:conn.peer});addMessage('System','A wanderer disconnected')})}
function handle(data,source){if(!data||typeof data!=='object')return;if(data.type==='session'){clearTimeout(joinTimer);start(data.seed,`Room ${roomInput.value.toUpperCase()}`);for(const p of data.players||[])if(p.id!==me.id)players.set(p.id,p);entity=data.entity||entity}else if(data.type==='state'&&data.player){const p=data.player;if(p.id!==me.id)players.set(p.id,{...p,name:clean(p.name)});if(data.entity)entity=data.entity;if(isHost)broadcast(data,source)}else if(data.type==='leave')players.delete(data.id);else if(data.type==='chat'){addMessage(clean(data.name),String(data.text).slice(0,100));if(isHost)broadcast(data,source)}else if(data.type==='win'){addMessage('System',`${clean(data.name)} found the exit!`);if(isHost)broadcast(data,source)}else if(data.type==='caught'&&data.id===me.id){me.x=CELL*1.5;me.y=CELL*1.5;notify('A smiler found you. Back to the start.')}}
function addMessage(name,text){const el=document.createElement('div');el.className='msg';el.textContent=`${name}: ${text}`;messages.append(el);while(messages.children.length>6)messages.firstChild.remove()}function notify(text){toast.textContent=text;toast.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.classList.remove('show'),2600)}function busy(on,text){q('#menu').querySelectorAll('button').forEach(b=>b.disabled=on);status.textContent=text}function peerError(e){clearTimeout(joinTimer);busy(false,`Online connection failed: ${e?.type||e?.message||'unknown error'}. Solo practice still works.`);peer?.destroy();peer=null}
q('#host').onclick=()=>{if(typeof Peer!=='function')return peerError({message:'multiplayer service did not load'});const room=makeCode();roomInput.value=room;isHost=true;online=true;busy(true,'Creating room…');peer=new Peer(PREFIX+room,PEER_OPTIONS);peer.on('open',()=>{busy(false,`Room ${room} is ready. Send this code to a friend.`);q('#copy').hidden=false;peer.on('connection',accept);start(Date.now()>>>0,`Room ${room} · Host`)});peer.on('error',peerError)};
q('#join').onclick=()=>{if(typeof Peer!=='function')return peerError({message:'multiplayer service did not load'});const room=roomInput.value.replace(/[^a-z0-9]/gi,'').slice(0,6).toUpperCase();if(room.length!==6){status.textContent='Enter the host’s 6-character room code.';return}isHost=false;online=true;busy(true,`Joining ${room}…`);peer=new Peer(PREFIX+'guest-'+makeCode().toLowerCase(),PEER_OPTIONS);peer.on('error',peerError);joinTimer=setTimeout(()=>peerError({message:'room did not answer'}),20000);peer.on('open',()=>{me.id=peer.id;hostConnection=peer.connect(PREFIX+room,{reliable:true,metadata:{name:clean(nameInput.value)}});hostConnection.on('data',d=>handle(d,hostConnection));hostConnection.on('open',()=>busy(false,'Connected. Waiting for the maze…'));hostConnection.on('close',()=>{online=false;notify('Host disconnected. You can keep exploring offline.')});hostConnection.on('error',peerError)});};
q('#solo').onclick=()=>{online=false;isHost=true;start(Date.now()>>>0,'Solo practice')};q('#copy').onclick=async()=>{await navigator.clipboard.writeText(roomInput.value).catch(()=>{});status.textContent='Room code copied.'};
addEventListener('keydown',e=>{if(e.key==='Enter'){if(chatInput.style.display==='block'){const text=chatInput.value.trim();if(text){addMessage(me.name,text);send({type:'chat',name:me.name,text})}chatInput.value='';chatInput.style.display='none';canvas.focus()}else if(running){chatInput.style.display='block';chatInput.focus()}e.preventDefault();return}if([chatInput,roomInput,nameInput].includes(document.activeElement))return;if(e.key.toLowerCase()==='f'){document.documentElement.requestFullscreen?.().catch(()=>{});return}if(e.key==='Escape'&&running){menu.style.display='grid';hud.style.display='none'}keys.add(e.key.toLowerCase());e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
})();
</script></body></html>
