<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Backrooms 3D Multiplayer</title>
  <style>
    :root{color-scheme:dark;--yellow:#e8d477;--panel:rgba(17,17,12,.94);--line:rgba(255,240,161,.25)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#080806;color:#fff;font:600 14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{border:0;border-radius:10px;padding:11px 13px;background:var(--yellow);color:#19170d;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.1)}button:disabled{opacity:.5;cursor:wait}button.alt{background:#343429;color:#fff}input{width:100%;padding:12px 13px;border:1px solid #5e5736;border-radius:10px;background:#11110d;color:#fff;outline:none}input:focus{border-color:var(--yellow)}
    #view{display:block;width:100%;height:100%;image-rendering:auto}.menu{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 25%,rgba(221,200,103,.18),transparent 42%),#090a07}.panel{width:min(480px,100%);padding:26px;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 24px 90px #000}h1{margin:0;color:var(--yellow);font-size:clamp(27px,6vw,43px);line-height:1.05;letter-spacing:.035em;text-transform:uppercase}.sub{margin:7px 0 20px;color:#bcb69a;font-weight:500}label{display:block;margin:11px 0 5px;color:#ddd5af;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}#status{min-height:20px;margin:11px 0 0;color:#c8c3a8;font-weight:500}.hint{margin:14px 0 0;color:#8e8975;font-size:12px;font-weight:500}
    #hud{position:fixed;inset:0;z-index:4;display:none;pointer-events:none}.chip{position:absolute;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:rgba(9,10,7,.76);backdrop-filter:blur(5px)}#room-chip{left:12px;top:12px}#goal{right:12px;top:12px;color:#f4e59b}#crosshair{position:absolute;left:50%;top:50%;width:16px;height:16px;translate:-50% -50%;opacity:.7}#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff}#crosshair:before{left:7px;top:1px;width:2px;height:14px}#crosshair:after{left:1px;top:7px;width:14px;height:2px}#fullscreen{position:absolute;right:12px;bottom:12px;pointer-events:auto;padding:8px 12px;background:rgba(9,10,7,.78);color:#fff;border:1px solid var(--line)}
    #chat{position:absolute;left:12px;bottom:12px;width:min(330px,calc(100% - 90px));pointer-events:auto}#messages{display:flex;max-height:130px;overflow:hidden;flex-direction:column;justify-content:end;gap:4px;margin-bottom:6px;text-shadow:0 2px 3px #000}.msg{padding:4px 8px;border-radius:7px;background:rgba(0,0,0,.5);font-weight:500}#chat-input{display:none;padding:9px 10px;background:rgba(9,10,7,.93)}#toast{position:fixed;left:50%;top:18%;z-index:7;translate:-50% -50%;padding:11px 17px;border:1px solid var(--line);border-radius:10px;background:rgba(9,10,7,.93);opacity:0;transition:.2s;pointer-events:none;text-align:center}#toast.show{opacity:1}
    #touch{position:absolute;inset:0;display:none;pointer-events:none}.pad,.turn{position:absolute;bottom:18px;display:grid;gap:7px;pointer-events:auto}.pad{right:18px;grid-template-columns:48px 48px 48px}.turn{left:18px;grid-template-columns:52px 52px}.touch-btn{height:46px;padding:0;background:rgba(14,14,10,.65);color:#fff;border:1px solid var(--line);touch-action:none}.pad [data-key=w]{grid-column:2}.pad [data-key=a]{grid-column:1}.pad [data-key=s]{grid-column:2}.pad [data-key=d]{grid-column:3}.turn .touch-btn{font-size:20px}
    @media(max-width:700px),(pointer:coarse){#touch{display:block}#chat{bottom:126px;width:calc(100% - 24px)}#fullscreen{bottom:126px}#crosshair{display:none}.actions{grid-template-columns:1fr}.panel{padding:20px}}
  </style>
</head>
<body>
  <canvas id="view" aria-label="Backrooms 3D multiplayer game"></canvas>
  <section id="menu" class="menu"><div class="panel">
    <h1>Backrooms 3D</h1><p class="sub">Online multiplayer maze escape</p>
    <label for="name">Player name</label><input id="name" maxlength="16" value="Wanderer" autocomplete="nickname">
    <label for="room">Room code</label><input id="room" maxlength="6" placeholder="Enter 6 characters" autocomplete="off">
    <div class="actions"><button id="host">Create room</button><button id="join">Join room</button><button id="solo" class="alt">Solo practice</button><button id="copy" class="alt" hidden>Copy room code</button></div>
    <p id="status">Create a room and send its code to a friend.</p><p class="hint">WASD moves · arrows or mouse turn · Enter chats · F enters fullscreen · Esc opens this menu</p>
  </div></section>
  <div id="hud"><div id="room-chip" class="chip"></div><div id="goal" class="chip">Find the glowing green exit</div><div id="crosshair"></div><button id="fullscreen" title="Fullscreen">⛶</button><div id="chat"><div id="messages"></div><input id="chat-input" maxlength="100" placeholder="Message the room…"></div><div id="touch"><div class="turn"><button class="touch-btn" data-key="arrowleft">↶</button><button class="touch-btn" data-key="arrowright">↷</button></div><div class="pad"><button class="touch-btn" data-key="w">▲</button><button class="touch-btn" data-key="a">◀</button><button class="touch-btn" data-key="s">▼</button><button class="touch-btn" data-key="d">▶</button></div></div></div>
  <div id="toast"></div>
  <script src="../../../vendor/peerjs/peerjs.min.js"></script>
  <script>
  (()=>{'use strict';
  const q=s=>document.querySelector(s),canvas=q('#view'),ctx=canvas.getContext('2d',{alpha:false}),menu=q('#menu'),hud=q('#hud'),status=q('#status'),roomInput=q('#room'),nameInput=q('#name'),chatInput=q('#chat-input'),messages=q('#messages'),toast=q('#toast');
  const COLS=31,ROWS=31,FOV=Math.PI/3,PREFIX='tg-backrooms-3d-',palette=['#61d8ff','#ff7287','#8bff77','#d68cff','#ffb45e','#728dff'];
  const PEER_OPTIONS={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}};
  let maze=[],seed=1,exit={x:COLS-1.5,y:ROWS-1.5},smiler={x:COLS/2,y:ROWS/2},peer,connections=[],hostConnection,isHost=false,online=false,running=false,last=0,lastSend=0,joinTimer;
  let me={id:'solo',name:'Wanderer',x:1.5,y:1.5,a:0,color:palette[0],won:false},players=new Map(),keys=new Set(),depth=[];
  const clean=s=>String(s||'').replace(/[^a-zA-Z0-9 _-]/g,'').trim().slice(0,16)||'Wanderer';
  const makeCode=()=>Math.random().toString(36).slice(2,8).toUpperCase();
  const norm=a=>{while(a>Math.PI)a-=Math.PI*2;while(a< -Math.PI)a+=Math.PI*2;return a};
  function randomFrom(value){return()=>{value|=0;value=value+0x6D2B79F5|0;let t=Math.imul(value^value>>>15,1|value);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function buildMaze(value){seed=value>>>0;const rnd=randomFrom(seed);maze=Array.from({length:ROWS},()=>Array(COLS).fill(1));const stack=[[1,1]];maze[1][1]=0;while(stack.length){const [x,y]=stack.at(-1),dirs=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>rnd()-.5);let moved=false;for(const [dx,dy] of dirs){const nx=x+dx,ny=y+dy;if(nx>0&&ny>0&&nx<COLS-1&&ny<ROWS-1&&maze[ny][nx]){maze[y+dy/2][x+dx/2]=0;maze[ny][nx]=0;stack.push([nx,ny]);moved=true;break}}if(!moved)stack.pop()}for(let i=0;i<50;i++){const x=1+Math.floor(rnd()*(COLS-2)),y=1+Math.floor(rnd()*(ROWS-2));if((x+y)%2)maze[y][x]=0}exit={x:COLS-1.5,y:ROWS-1.5};maze[ROWS-2][COLS-2]=maze[ROWS-2][COLS-3]=0;let open=[];for(let y=5;y<ROWS-5;y++)for(let x=5;x<COLS-5;x++)if(!maze[y][x])open.push({x:x+.5,y:y+.5});smiler=open[Math.floor(rnd()*open.length)]||{x:COLS/2,y:ROWS/2}}
  function wall(x,y,r=.18){return[[x-r,y-r],[x+r,y-r],[x-r,y+r],[x+r,y+r]].some(([px,py])=>{const cx=Math.floor(px),cy=Math.floor(py);return cx<0||cy<0||cx>=COLS||cy>=ROWS||maze[cy][cx]})}
  function resize(){const d=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.max(1,innerWidth*d);canvas.height=Math.max(1,innerHeight*d);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
  function move(dt){const turn=((keys.has('arrowright')?1:0)-(keys.has('arrowleft')?1:0))*2.15*dt;me.a=norm(me.a+turn);const forward=(keys.has('w')?1:0)-(keys.has('s')?1:0),strafe=(keys.has('d')?1:0)-(keys.has('a')?1:0),speed=2.75*dt,dx=(Math.cos(me.a)*forward+Math.cos(me.a+Math.PI/2)*strafe)*speed,dy=(Math.sin(me.a)*forward+Math.sin(me.a+Math.PI/2)*strafe)*speed;if(!wall(me.x+dx,me.y))me.x+=dx;if(!wall(me.x,me.y+dy))me.y+=dy;if(!me.won&&Math.hypot(me.x-exit.x,me.y-exit.y)<.6){me.won=true;notify('You escaped the Backrooms!');send({type:'win',id:me.id,name:me.name})}}
  function moveSmiler(dt){if(online&&!isHost)return;const all=[me,...players.values()].filter(p=>!p.won);if(!all.length)return;const target=all.reduce((a,b)=>Math.hypot(b.x-smiler.x,b.y-smiler.y)<Math.hypot(a.x-smiler.x,a.y-smiler.y)?b:a,all[0]),a=Math.atan2(target.y-smiler.y,target.x-smiler.x),step=.72*dt,dx=Math.cos(a)*step,dy=Math.sin(a)*step;if(!wall(smiler.x+dx,smiler.y,.2))smiler.x+=dx;else if(!wall(smiler.x,smiler.y+Math.sign(dy)*step,.2))smiler.y+=Math.sign(dy)*step;if(!wall(smiler.x,smiler.y+dy,.2))smiler.y+=dy;else if(!wall(smiler.x+Math.sign(dx)*step,smiler.y,.2))smiler.x+=Math.sign(dx)*step;if(Math.hypot(target.x-smiler.x,target.y-smiler.y)<.42){if(target.id===me.id){me.x=1.5;me.y=1.5;notify('A smiler caught you. Back to the start.')}else send({type:'caught',id:target.id})}}
  function background(w,h){const ceiling=ctx.createLinearGradient(0,0,0,h/2);ceiling.addColorStop(0,'#171710');ceiling.addColorStop(1,'#8b7b3e');ctx.fillStyle=ceiling;ctx.fillRect(0,0,w,h/2);const floor=ctx.createLinearGradient(0,h/2,0,h);floor.addColorStop(0,'#49452f');floor.addColorStop(1,'#11120d');ctx.fillStyle=floor;ctx.fillRect(0,h/2,w,h/2);ctx.fillStyle='rgba(255,246,178,.12)';for(let x=0;x<w;x+=90)ctx.fillRect(x,0,35,3)}
  function rays(w,h){const strip=2,count=Math.ceil(w/strip);depth.length=count;for(let i=0;i<count;i++){const rayA=me.a-FOV/2+(i/count)*FOV,cs=Math.cos(rayA),sn=Math.sin(rayA);let d=.02,hitX=0,hitY=0;for(;d<24;d+=.025){hitX=me.x+cs*d;hitY=me.y+sn*d;if(wall(hitX,hitY,.01))break}const fixed=d*Math.cos(rayA-me.a),height=Math.min(h*1.8,h/(fixed+.001)),top=(h-height)/2,cellX=hitX-Math.floor(hitX),cellY=hitY-Math.floor(hitY),edge=Math.min(cellX,1-cellX,cellY,1-cellY),shade=Math.max(.2,1-fixed/21)*(edge<.035?.74:1);ctx.fillStyle=`rgb(${Math.floor(210*shade)},${Math.floor(190*shade)},${Math.floor(91*shade)})`;ctx.fillRect(i*strip,top,strip+1,height);if(i%9===0){ctx.fillStyle='rgba(66,55,20,.18)';ctx.fillRect(i*strip,top,1,height)}depth[i]=fixed}}
  function sprite(obj,type,w,h){const dx=obj.x-me.x,dy=obj.y-me.y,dist=Math.hypot(dx,dy),diff=norm(Math.atan2(dy,dx)-me.a);if(Math.abs(diff)>FOV*.68||dist<.12)return;const sx=w/2+Math.tan(diff)*(w/(2*Math.tan(FOV/2))),size=Math.min(h*1.2,h/dist*(type==='exit'?1.05:.65)),column=Math.max(0,Math.min(depth.length-1,Math.floor(sx/2)));if(dist>depth[column]+.18)return;const x=sx-size/2,y=h/2-size/2;ctx.save();if(type==='exit'){ctx.shadowColor='#43ff79';ctx.shadowBlur=30;ctx.fillStyle='#4cff83';ctx.fillRect(x+size*.2,y,size*.6,size);ctx.fillStyle='#082311';ctx.font=`800 ${Math.max(10,size*.13)}px system-ui`;ctx.textAlign='center';ctx.fillText('EXIT',sx,y+size*.55)}else{ctx.translate(sx,y+size*.54);ctx.shadowColor=type==='smiler'?'#000':obj.color;ctx.shadowBlur=20;ctx.fillStyle=type==='smiler'?'#020202':obj.color;ctx.beginPath();ctx.arc(0,0,size*.22,0,Math.PI*2);ctx.fill();ctx.fillRect(-size*.15,size*.13,size*.3,size*.38);if(type==='smiler'){ctx.fillStyle='#fff';ctx.fillRect(-size*.1,-size*.05,size*.06,size*.035);ctx.fillRect(size*.04,-size*.05,size*.06,size*.035);ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1,size*.018);ctx.beginPath();ctx.arc(0,size*.03,size*.1,.15,Math.PI-.15);ctx.stroke()}else{ctx.fillStyle='#fff';ctx.font=`700 ${Math.max(9,size*.1)}px system-ui`;ctx.textAlign='center';ctx.fillText(obj.name,0,-size*.29)}}ctx.restore()}
  function draw(){const w=innerWidth,h=innerHeight;background(w,h);rays(w,h);const sprites=[{...exit,type:'exit'},{...smiler,type:'smiler'},...[...players.values()].map(p=>({...p,type:'player'}))].sort((a,b)=>Math.hypot(b.x-me.x,b.y-me.y)-Math.hypot(a.x-me.x,a.y-me.y));for(const s of sprites)sprite(s,s.type,w,h);const vignette=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.16,w/2,h/2,Math.max(w,h)*.65);vignette.addColorStop(0,'rgba(0,0,0,0)');vignette.addColorStop(1,'rgba(0,0,0,.72)');ctx.fillStyle=vignette;ctx.fillRect(0,0,w,h)}
  function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.04)||0;last=now;move(dt);moveSmiler(dt);if(now-lastSend>70){lastSend=now;send({type:'state',player:me,smiler:isHost||!online?smiler:undefined})}draw();requestAnimationFrame(loop)}
  function start(value,label){buildMaze(value);const startAngle=maze[1][2]===0?0:Math.PI/2;me={id:peer?.id||'solo',name:clean(nameInput.value),x:1.5,y:1.5,a:startAngle,color:palette[Math.floor(Math.random()*palette.length)],won:false};players.clear();menu.style.display='none';hud.style.display='block';q('#room-chip').textContent=label;running=true;last=performance.now();requestAnimationFrame(loop);canvas.focus()}
  function broadcast(data,except){for(const c of connections)if(c.open&&c!==except)c.send(data)}function send(data){if(!online)return;if(isHost)broadcast(data);else if(hostConnection?.open)hostConnection.send(data)}
  function accept(conn){connections.push(conn);conn.on('open',()=>{conn.send({type:'session',seed,players:[me,...players.values()],smiler});addMessage('System',`${conn.metadata?.name||'A wanderer'} joined`)});conn.on('data',d=>handle(d,conn));conn.on('close',()=>{connections=connections.filter(c=>c!==conn);players.delete(conn.peer);broadcast({type:'leave',id:conn.peer});addMessage('System','A wanderer disconnected')})}
  function handle(data,source){if(!data||typeof data!=='object')return;if(data.type==='session'){clearTimeout(joinTimer);start(data.seed,`Room ${roomInput.value.toUpperCase()}`);for(const p of data.players||[])if(p.id!==me.id)players.set(p.id,p);smiler=data.smiler||smiler}else if(data.type==='state'&&data.player){const p=data.player;if(p.id!==me.id)players.set(p.id,{...p,name:clean(p.name)});if(data.smiler)smiler=data.smiler;if(isHost)broadcast(data,source)}else if(data.type==='leave')players.delete(data.id);else if(data.type==='chat'){addMessage(clean(data.name),String(data.text).slice(0,100));if(isHost)broadcast(data,source)}else if(data.type==='win'){addMessage('System',`${clean(data.name)} escaped!`);if(isHost)broadcast(data,source)}else if(data.type==='caught'&&data.id===me.id){me.x=1.5;me.y=1.5;notify('A smiler caught you. Back to the start.')}}
  function addMessage(name,text){const el=document.createElement('div');el.className='msg';el.textContent=`${name}: ${text}`;messages.append(el);while(messages.children.length>6)messages.firstChild.remove()}function notify(text){toast.textContent=text;toast.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.classList.remove('show'),2600)}function busy(on,text){q('#menu').querySelectorAll('button').forEach(b=>b.disabled=on);status.textContent=text}function peerError(e){clearTimeout(joinTimer);online=false;busy(false,`Online connection failed: ${e?.type||e?.message||'unknown error'}. Solo practice still works.`);peer?.destroy();peer=null}
  q('#host').onclick=()=>{if(typeof Peer!=='function')return peerError({message:'multiplayer service did not load'});const room=makeCode();roomInput.value=room;isHost=true;online=true;busy(true,'Creating room…');peer=new Peer(PREFIX+room,PEER_OPTIONS);peer.on('open',()=>{busy(false,`Room ${room} is ready. Send this code to a friend.`);q('#copy').hidden=false;peer.on('connection',accept);start(Date.now()>>>0,`Room ${room} · Host`)});peer.on('error',peerError)};
  q('#join').onclick=()=>{if(typeof Peer!=='function')return peerError({message:'multiplayer service did not load'});const room=roomInput.value.replace(/[^a-z0-9]/gi,'').slice(0,6).toUpperCase();if(room.length!==6){status.textContent='Enter the host’s 6-character room code.';return}isHost=false;online=true;busy(true,`Joining ${room}…`);peer=new Peer(PREFIX+'guest-'+makeCode().toLowerCase(),PEER_OPTIONS);peer.on('error',peerError);joinTimer=setTimeout(()=>peerError({message:'room did not answer'}),20000);peer.on('open',()=>{me.id=peer.id;hostConnection=peer.connect(PREFIX+room,{reliable:true,metadata:{name:clean(nameInput.value)}});hostConnection.on('data',d=>handle(d,hostConnection));hostConnection.on('open',()=>busy(false,'Connected. Waiting for the maze…'));hostConnection.on('close',()=>{online=false;notify('Host disconnected. You can keep exploring offline.')});hostConnection.on('error',peerError)})};
  q('#solo').onclick=()=>{online=false;isHost=true;start(Date.now()>>>0,'Solo practice')};q('#copy').onclick=async()=>{await navigator.clipboard.writeText(roomInput.value).catch(()=>{});status.textContent='Room code copied.'};
  function fullscreen(){document.documentElement.requestFullscreen?.().catch(()=>{})}q('#fullscreen').onclick=fullscreen;
  addEventListener('keydown',e=>{if(e.key==='Enter'){if(chatInput.style.display==='block'){const text=chatInput.value.trim();if(text){addMessage(me.name,text);send({type:'chat',name:me.name,text})}chatInput.value='';chatInput.style.display='none';canvas.focus()}else if(running){chatInput.style.display='block';chatInput.focus()}e.preventDefault();return}if([chatInput,roomInput,nameInput].includes(document.activeElement))return;if(e.key.toLowerCase()==='f'){fullscreen();return}if(e.key==='Escape'&&running){menu.style.display='grid';hud.style.display='none'}keys.add(e.key.toLowerCase());e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
  canvas.addEventListener('click',()=>canvas.requestPointerLock?.());addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas&&running)me.a=norm(me.a+e.movementX*.0025)});
  for(const b of document.querySelectorAll('.touch-btn')){const key=b.dataset.key,on=e=>{e.preventDefault();keys.add(key)},off=e=>{e.preventDefault();keys.delete(key)};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)}
  })();
  </script>
</body>
</html>
